name: Build CuteVoiceStudio exe

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt pyinstaller

      - name: Selftest (audio chain)
        run: python selftest.py

      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name CuteVoiceStudio
          --collect-all numpy --collect-all sounddevice --collect-all pedalboard
          --hidden-import=audio_io --hidden-import=engine --hidden-import=winperf
          app.py

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: CuteVoiceStudio
          path: dist/CuteVoiceStudio.exe
